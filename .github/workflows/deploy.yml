name: Build & Deploy

on:
  push:
    branches:
      - main
  #     - pre-release

  workflow_dispatch: # permite rodar manualmente pelo GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Build: injeta keys.js inline nos HTMLs ──────────────────────────
      - name: Run build script
        working-directory: website # <-- Diz para rodar o node dentro da pasta 'website'
        run: node build.mjs

      # ── Deploy: publica a pasta dist/ no GitHub Pages ──────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/ # <-- Aponta para o local correto onde a build foi gerada

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
